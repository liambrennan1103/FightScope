[build.environment]
  NODE_VERSION = "20"
  # FIGHTSCOPE_ALLOW_DEV_PLAN is a non-secret boolean-ish flag (typically "1").
  # Its value collides with thousands of bytes in source/build output → Netlify
  # secrets-scan false positive. Do NOT omit real credentials here.
  SECRETS_SCAN_OMIT_KEYS = "FIGHTSCOPE_ALLOW_DEV_PLAN"
  # Turbopack/Next may cache compilation artifacts that briefly retain env bytes.
  # Cache is not published to the CDN; omit from scan only.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache,.next/dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Next.js site build remains your existing Netlify Next runtime / plugin setup.
# Scheduled functions POST to /api/jobs/run using CRON_SECRET.
#
# Required production env vars — see docs/DEPLOYMENT.md
# AUTH_SECRET, NEXT_PUBLIC_SITE_URL, SUPABASE_*, STRIPE_*, CRON_SECRET
#
# Stripe webhook path: /api/billing/webhook
# (configure in Stripe Dashboard → Developers → Webhooks)
#
# Do NOT set FIGHTSCOPE_ALLOW_DEV_PLAN or FIGHTSCOPE_DEV_PLAN in production.
